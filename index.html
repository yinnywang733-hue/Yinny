<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yinny Studios</title>
<meta name="theme-color" content="#1d1d24"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Yinny Studios">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Lobster&family=Pacifico&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e1e24;color:#eee;font-family:system-ui,sans-serif}
:root{--cream:#efe6c9;--ink:#222;--pan:#2b2b2b;--tile:#3c3c3c;--hi:#4f7cff}
#app{display:grid;height:100%;grid-template-columns:auto 176px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "tools opts stage" "tl tl tl"}
#app.noopt{grid-template-columns:auto 0 minmax(0,1fr)}
#app.noopt #opts,#app.notl #tlw{display:none}
#top{grid-area:top}#tools{grid-area:tools}#tlw{grid-area:tl}#opts{grid-area:opts}#stage{grid-area:stage}
button,select{background:var(--tile);color:#fff;border:0;border-radius:3px;padding:9px 11px;font-size:14px;white-space:nowrap;flex:none}
button.on{background:var(--hi)}
label{font-size:14px;white-space:nowrap;flex:none}
.box{display:flex;gap:6px;align-items:center}
[hidden]{display:none!important}
#stage{display:grid;place-items:center;padding:6px;min-height:0;min-width:0;overflow:hidden}
#stage{position:relative}#stage canvas{position:absolute;border-radius:4px;touch-action:none}
#view{background:transparent}#stage.board{outline:3px solid #4f7cff;outline-offset:-3px}
#tlw{display:flex;background:#2a2a33;gap:6px;padding:4px 6px;align-items:stretch}
#tlbtns{display:flex;flex-direction:column;gap:4px;justify-content:center}
#tlbtns button{padding:5px 8px;font-size:12px}
#tlmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}#scrub{position:relative;width:100%;height:30px;margin:0;border-radius:15px;background:#1d1d24 repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.09) 11px 12px);border:1px solid #555;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;overflow:hidden;flex:none}#sfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3558c8,#4f7cff);border-radius:15px 0 0 15px;pointer-events:none}#sth{position:absolute;top:2px;bottom:2px;width:40px;border-radius:13px;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;font-size:13px;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.6)}#sth b{font-weight:700}
#pj{position:fixed;top:0;right:0;bottom:0;left:0;background:#1e1e1e;z-index:40;display:flex;flex-direction:column}#pj[hidden]{display:none}
#pjh{display:flex;gap:8px;align-items:center;padding:8px;background:#2b2b2b;color:#eee}#pjh span{flex:1;font-size:12px;opacity:.7}
#pjg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:10px;overflow:auto;flex:1;align-content:start}
.pc{background:#333;border-radius:4px;padding:6px;color:#eee}.pc img{width:100%;aspect-ratio:16/9;background:#fff;object-fit:cover;display:block;border-radius:2px}.pn{margin:5px 0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr{display:flex;gap:4px}.pr button{flex:1;padding:6px 2px;font-size:12px}
#tlscroll{flex:1;min-width:0;overflow:auto;max-height:112px;background:#cfd2d8;border:1px solid #777}
#ruler,#row{display:flex;width:max-content;min-width:100%}
.rn{flex:none;width:26px;height:16px;font-size:10px;line-height:16px;color:#333;background:#e9e9ee;border-right:1px solid #aaa;padding-left:2px;cursor:pointer}
.rn.cur{background:#e8231c;color:#fff}
.cell{flex:none;width:26px;height:30px;background:#fff;border-right:1px solid #bbb;border-top:1px solid #bbb;position:relative;cursor:pointer}
.cell.five{background:#eef1f7}
.cell.cur{background:#ffd9d6}
.cell.cur::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#e8231c}
.cell i{position:absolute;z-index:1;left:50%;bottom:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid #222}
.cell.has i{background:#222}
#tlbox{width:max-content;min-width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lr{display:flex;width:max-content;min-width:100%}
.rr{position:sticky;top:0;z-index:6}
.ln{position:sticky;left:0;z-index:5;flex:none;width:92px;height:26px;display:flex;align-items:center;gap:5px;padding:0 6px;background:#3b3b47;color:#fff;font-size:12px;border-top:1px solid #555;border-right:2px solid #222;cursor:pointer;overflow:hidden}
.ln.corner{height:16px;background:#2a2a33;border:0;cursor:default}
.ln.gh{background:#2d5a46;height:22px}.eye.dh{cursor:grab;touch-action:none;opacity:.8}.dropt{outline:2px solid #ffd23f;outline-offset:-2px}.lr.sel .ln{background:#4f7cff}
.lr .cell{height:26px}
.lr.sel .cell.cur{background:#ffc2bd}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow{display:flex;gap:4px}
#nw{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:70}#nw[hidden]{display:none}#nwb{background:#2d2d38;color:#fff;border-radius:10px;padding:12px;width:min(480px,92%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:6px}#nwb h4{margin:6px 0 2px;color:#ffd23f;font-size:14px}#nwb li{font-size:13px;margin:2px 0}#nwb ul{margin:0;padding-left:18px}
#np{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;z-index:45}#np[hidden],#cmBar[hidden]{display:none}
#npb{background:#2d2d38;color:#fff;border-radius:8px;padding:10px;width:min(440px,92%);display:flex;flex-direction:column;gap:6px}#npb button{padding:8px}#npb .trow button{flex:1}
#cmBar{position:fixed;top:6px;right:8px;z-index:35;background:#7a2fd6;color:#fff;border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center;font-size:13px}
#dlg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;z-index:50}
#dbox{background:#2a2a33;padding:10px;border-radius:12px;width:min(96%,620px);display:flex;flex-direction:column;gap:8px}
#kb{display:flex;flex-direction:column;gap:3px}#kb .kr{display:flex;gap:3px}#kb button{flex:1;padding:0;height:34px;font-size:15px;background:#3b3b47;color:#fff;border-radius:5px;min-width:0}#kb button.w{flex:2.2}#kb button.sp{flex:6}#kb button.on{background:#4f7cff}
#dbox input{font-size:16px;padding:10px;border-radius:8px;border:0;background:#3b3b47;color:#fff}
.drow{display:flex;gap:8px}.drow button{flex:1}
#row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell.lift{outline:2px solid #4f7cff;z-index:3;transform:translateY(-3px)}
.cell.drop{box-shadow:inset 4px 0 0 #4f7cff}
/* ---- flat panels: tools on the left, options in the middle, canvas on the right ---- */
#tools{display:flex;flex-direction:column;gap:3px;padding:3px;background:var(--pan);width:auto;overflow-x:hidden;overflow-y:auto}
.tg{display:grid;grid-template-columns:repeat(3,44px);gap:3px}.tg.one{grid-template-columns:1fr}
#tools button{width:44px;height:34px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:8px;line-height:1.1;background:var(--tile);color:var(--cream);border-radius:3px}
#tools button b{font-size:14px;font-weight:400;line-height:1}
#tools button.on,#tools button.cr{background:var(--cream);color:var(--ink)}
#tools button.cr{height:38px;font-size:12px;font-weight:600}
#opts{background:#333;padding:6px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.sec{display:flex;flex-direction:column;gap:4px}
#opts label{font-size:12px;color:#ddd}
#opts input[type=color]{width:100%;height:32px;border:2px solid #555;border-radius:3px;padding:0;background:none}
#opts input[type=range]{width:100%}
#opts button,#opts select{width:100%;border-radius:3px;padding:10px 6px;background:var(--cream);color:var(--ink);font-size:13px}
#opts .box{flex-direction:column;align-items:stretch}
#olSides button.on,#shpBox button.on,#objBox button.on{background:#4f7cff}#tools button.bdon{outline:2px solid #4f7cff;background:#4f7cff55}#tools button.v{outline:2px solid #4f7cff}#tools button.v::after{content:"vector";font-size:8px;color:#4f7cff}.rn.ct{box-shadow:inset 0 -3px #4f7cff}.rn.kf{color:#b58900;font-weight:900}
#tlbox{position:relative}.trow{flex-wrap:wrap}.ln{width:112px}.rr{touch-action:none}.cell.gap{background:#f4f4f6}.rn.ct{background:#e8231c;color:#fff;box-shadow:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#e8231c;pointer-events:none;z-index:4}#ph u{position:absolute;top:0;left:-6px;width:14px;height:12px;background:#e8231c;border-radius:0 0 7px 7px}
#fi{font-size:11px;color:#ddd;align-self:center;padding:0 4px}.cell.lift{opacity:.85}
#cList{display:flex;flex-direction:column;gap:4px}.crow{display:flex;gap:4px}.crow button:first-child{flex:1}.crow button+button{width:44px;flex:none}
#xp{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center}#xp[hidden]{display:none}#xbox{background:#333;color:#eee;padding:14px;border-radius:6px;display:flex;flex-direction:column;gap:8px;min-width:240px}#xst{font-size:12px;opacity:.8}
#sizePre{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}#sizePre button{padding:6px 4px;width:auto;flex:1 0 44px}#sizePre button.on{background:#4f7cff;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#tlw{background:#333}
#tlbtns button{background:var(--cream);color:var(--ink);border-radius:3px;padding:5px 7px;font-size:12px}
#tlbtns button:disabled{opacity:.4}
#tlscroll{max-height:100px}
#stage{background:#1c1c1c}
#opts input[type=text]{width:100%;padding:8px;border:0;border-radius:3px;background:#444;color:#fff;font-size:13px}
#pal{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.sw{aspect-ratio:1;border:2px solid #666;border-radius:3px;touch-action:manipulation}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #4f7cff}
.cell i{left:8px;margin-left:0}
.cell.cur::after{left:13px}
.cell.hold::before{content:"";position:absolute;left:16px;right:8px;bottom:8px;height:2px;background:#222;opacity:.6}
.hd{display:none;position:absolute;right:0;top:0;bottom:0;width:16px;background:#4f7cff;touch-action:none;cursor:ew-resize;z-index:4}
.hd::after{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#fff}
.cell.cur .hd{display:block}
#top{display:flex;gap:4px;align-items:center;padding:3px 4px;background:var(--pan);overflow-x:auto;overflow-y:hidden}
#top button{height:34px;padding:0 9px;flex:none;font-size:13px;background:var(--tile);color:var(--cream);border-radius:3px;display:flex;align-items:center;gap:4px}
#top button.on{background:var(--cream);color:var(--ink)}#top #play{background:#e8231c;color:#fff;font-weight:700;min-width:76px;justify-content:center}
#top button b{font-weight:400;font-size:15px}#top .qs{display:flex;align-items:center;gap:4px;color:#ddd;font-size:12px;flex:none}#top .qs input[type=range]{width:110px}#top .qs input[type=color]{width:34px;height:30px;padding:0;border:2px solid #666;border-radius:3px;background:none}
#root{position:fixed;left:0;top:0;width:100%;height:100%}
html.rot #root{width:var(--ph);height:var(--pw);transform-origin:0 0;transform:translateX(var(--pw)) rotate(90deg)}   /* phone held upright: the whole app is turned sideways so it is ALWAYS horizontal */
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;z-index:30;max-width:80%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}#toast.on{opacity:1}
#cf{position:absolute;right:8px;top:8px;z-index:31;background:#2a2a33;color:#fff;border:2px solid #4f7cff;border-radius:10px;padding:8px 10px;max-width:230px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5)}#cf button{margin:6px 6px 0 0;padding:6px 12px;border-radius:6px;background:#3b3b47;color:#fff}#cf #cfy{background:#4f7cff}
#fbadge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 7px;border-radius:4px;pointer-events:none}
</style>
</head>
<body>
<div id="root">
<div id="app">
  <div id="top">
    <button id="projBtn" title="Projects"><b>📁</b></button><button id="undo"><b>↩</b></button><button id="redo"><b>↪</b></button><button id="prevF"><b>◀</b></button><button id="nextF"><b>▶</b></button><button id="play"><b>▶</b>Play</button>
    <button id="onion" class="on" title="Onion skin"><b>🧅</b></button><button id="gridB" title="Grid"><b>▦</b></button><button id="full"><b>⛶</b></button><button id="tlToggle" title="Timeline"><b>🎞</b></button><button id="optToggle" title="Tool options"><b>⚙</b></button><button id="exp" title="Export"><b>⬇</b></button>
    <span class="qs">Size <input type="range" id="qsz" min="1" max="300" value="6"><b id="qszN">6</b></span><span class="qs"><input type="color" id="qcol" value="#000000"></span>
  </div>
  <div id="tools">
    <div class="tg">
      <button data-t="brush" class="on"><b>✏️</b>Brush</button>
      <button data-t="eraser"><b>🧽</b>Eraser</button>
      <button data-t="line"><b>／</b>Line</button>
      <button data-t="shape"><b>▭</b>Shapes</button>
      <button data-t="lasso"><b>➰</b>Lasso</button>
      <button data-t="eye"><b>💧</b>Picker</button>
      <button data-t="bucket"><b>🪣</b>Bucket</button>
      <button data-t="text"><b>T</b>Text</button>
      <button data-t="vsel"><b>↖</b>V-Select</button><button data-t="obj"><b>◇</b>Objects</button>
      <button data-t="key"><b>◆</b>Keyframe</button>
      <button data-t="cam"><b>🎥</b>Camera</button>
      <button id="reset"><b>⟲</b>Straighten</button>
      <button id="imgBtn"><b>🖼</b>Image</button><button id="mediaBtn"><b>🎞</b>GIF/Video</button>
      <button data-t="clip"><b>🎞</b>Symbol</button>
    </div>
  </div>

  <div id="opts">
    <div class="sec"><label>Colour</label><input type="color" id="col" value="#000000"><input type="text" id="hex" value="#000000" maxlength="7" autocomplete="off" spellcheck="false"></div>
    <div class="sec"><label>Palette (hold to replace)</label><div id="pal"></div><button id="palAdd">＋ Add this colour</button></div>
    <div class="sec"><label>Brush size <b id="sizeN">6</b></label><input type="range" id="size" min="1" max="300" value="6"><div id="sizePre"></div><button id="sizeAdd">＋ Save this size</button></div>
    <div class="box sec" id="olBox" hidden><button id="olTog">Outline: off</button><label>Outline colour · thickness</label><input type="color" id="olc" value="#ffffff"><input type="range" id="olw" min="1" max="60" value="6"><label>Which side</label><div class="two" id="olSides"><button data-s="both" class="on">Both</button><button data-s="left">◀ Left</button><button data-s="right">Right ▶</button><button data-s="top">▲ Top</button><button data-s="bottom">▼ Bottom</button></div><button id="olOff">Remove outline from selected</button></div>
    <div class="box sec" id="clipBox" hidden><label>🎞 Symbols: animate something once (explosion, fire, a walk…), then reuse it anywhere. It plays by itself like a movieclip.</label><button id="cNew">＋ Create new symbol</button><label>Your symbols · tap one to place it</label><div id="lList"></div><button id="cMake" hidden>＋ Make clip from this layer</button><label>Used in this project (🔊 = add sounds)</label><div id="cList"></div><div id="sfx" hidden><label id="sfxT"></label><div class="trow"><select id="sfxK"></select><select id="sfxF"></select></div><div class="trow"><button id="sfxAdd">＋ Add sound</button><button id="sfxTry">▶ Try</button><button id="sfxMine">My own file</button></div><div id="sfxL"></div></div>
</div>
    <div class="box sec" id="shpBox" hidden><label>Shape (drag on the canvas)</label><div class="two"><button id="shR" class="on">▭ Rectangle</button><button id="shS">□ Square</button><button id="shC">○ Circle</button><button id="shB">● Sphere</button></div><button id="shF">Fill: off</button></div>
    <div class="box sec" id="txtBox" hidden><label>Font</label><select id="font"><option value="'Comic Neue', 'Comic Sans MS', cursive">Comic (bold)</option><option value="'Bangers', Impact, fantasy">Bangers</option><option value="'Pacifico', cursive">Pacifico</option><option value="'Permanent Marker', cursive">Marker</option><option value="'Lobster', Georgia, serif">Lobster</option></select></div>
    <div class="box sec" id="selBox" hidden><label>Selection</label>
      <div class="two"><button id="copy">Copy</button><button id="paste">Paste</button><button id="del">Delete</button><button id="fH">Flip ↔</button><button id="fV">Flip ↕</button><button id="done">Done</button></div>
    </div>
    <div class="box sec" id="bkBox" hidden><label>Fill style</label><select id="bkM"><option value="s">Solid</option><option value="h">Gradient left→right</option><option value="v">Gradient top→bottom</option><option value="r">Gradient centre→edge</option></select><label>Gradient end colour</label><input type="color" id="col2" value="#ffffff"><label>Close gaps in lines</label><select id="bkG"><option value="0">Off</option><option value="4">Small gaps</option><option value="10">Medium gaps</option><option value="20" selected>Large gaps</option></select></div>
    <div class="box sec" id="vsBox" hidden><label>Vector select: drag a loop around strokes. Drag inside the box to move; the circle turns, the blue square resizes.</label><div class="trow"><button id="vsAll">Select all</button><button id="vsDup">Duplicate</button><button id="vsDel">Delete</button></div><div class="trow"><button id="vsCopy">Copy</button><button id="vsPaste">Paste</button></div><div class="trow"><button id="vsPers">⬚ Perspective</button><button id="vsMesh">▦ Mesh</button></div><div id="vsN"></div></div>
    <div class="box sec" id="dmBox" hidden><label>Draw mode</label><select id="dMode"><option value="source-over">Draws in front</option><option value="destination-over">Draws behind</option><option value="source-atop">Draws inside</option></select></div>
    <div class="box sec" id="bsBox" hidden><label>Brush style</label><select id="bStyle"><option value="n">Normal</option><option value="a">Airbrush (soft spray)</option><option value="s">Sketch (pencil)</option></select></div>
    <div class="box sec" id="symBox" hidden><label>Symmetry (normal brush, eraser, line)</label><button id="symB">Symmetry: off</button></div>
    <div class="box sec" id="vecBox" hidden><label>Brush type</label><button id="vToggle">Normal brush</button></div>
    <div class="box sec" id="keyBox" hidden><label>Keyframes (like Flash): 1) tap a stroke  2) go to another frame  3) ◆ Insert keyframe  4) drag it, turn it or resize it with the handles. The frames in between animate by themselves.</label><div class="two"><button id="kAdd">◆ Insert keyframe</button><button id="kDel">◇ Clear keyframe</button></div><button id="kDelAll">⛔ Delete ALL keyframes of this stroke</button><label>Ease <b id="kEzN">0</b> (− starts slow · + ends slow)</label><input type="range" id="kEz" min="-100" max="100" step="10" value="0"></div>
    <div class="box sec" id="objBox" hidden><label>Only vector strokes work here: double-tap Brush to make one, tap it, then go to another frame and move/bend it = keyframe + tween</label>
      <div class="two"><button id="oMove" class="on">Move</button><button id="oBend">Bend</button><button id="oPers">⬚ Perspective</button><button id="oMesh">▦ Mesh</button><button id="oEase">Ease: off</button><button id="oTw">Tween: all</button><button id="oDup">Duplicate</button><button id="oCopy">Copy</button><button id="oPaste">Paste</button><button id="oDel">Delete</button></div>
      <label>Blur this stroke only <b id="oblN">0</b></label><input type="range" id="obl" min="0" max="40" value="0"><label>Glow this stroke only <b id="oglN">0</b></label><input type="range" id="ogl" min="0" max="40" value="0"><label>Glow colour</label><div class="two"><input type="color" id="oglc" value="#ffd24a"><button id="oglcA">Same as stroke</button></div>
